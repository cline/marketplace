<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="c1i-title c1i-desc">
  <title id="c1i-title">算邻坊 - 三环互联图标</title>
  <desc id="c1i-desc">三个互联的几何节点，纯图形无文字，小尺寸清晰可辨</desc>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Connecting edges — gradient dashed lines -->
  <line x1="100" y1="46" x2="48" y2="135" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5" opacity="0.45"/>
  <line x1="48" y1="135" x2="152" y2="135" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5" opacity="0.45"/>
  <line x1="152" y1="135" x2="100" y2="46" stroke="url(#g3)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5" opacity="0.45"/>

  <!-- Node 1: 算 (Compute) — double ring + center dot = chip / core -->
  <g filter="url(#glow)">
    <circle cx="100" cy="46" r="30" fill="url(#g1)" opacity="0.95"/>
  </g>
  <circle cx="100" cy="46" r="30" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.12"/>
  <circle cx="100" cy="46" r="22" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.55"/>
  <circle cx="100" cy="46" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35"/>
  <circle cx="100" cy="46" r="5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Node 2: 邻 (Neighbor) — single ring + 3 satellite dots = community -->
  <g filter="url(#glow)">
    <circle cx="48" cy="135" r="24" fill="url(#g2)" opacity="0.95"/>
  </g>
  <circle cx="48" cy="135" r="24" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.12"/>
  <circle cx="48" cy="135" r="16" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
  <!-- 3 satellite dots around the ring -->
  <circle cx="36" cy="122" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="60" cy="122" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="48" cy="148" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Node 3: 坊 (Workshop) — cross/grid = marketplace structure -->
  <g filter="url(#glow)">
    <circle cx="152" cy="135" r="24" fill="url(#g3)" opacity="0.95"/>
  </g>
  <circle cx="152" cy="135" r="24" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.12"/>
  <circle cx="152" cy="135" r="16" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
  <!-- Cross lines — marketplace/坊 -->
  <line x1="140" y1="135" x2="164" y2="135" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <line x1="152" y1="123" x2="152" y2="147" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
</svg>